; Свойства:
; объявление переменных — явное
; преобразование типов — неявное
; оператор присваивания — одноцелевой (a = b)
; структуры, ограничивающие область видимости — подпрограммы
; маркер блочного оператора — явные { } или begin end
; условные операторы — if-then-else и switch-case
; перегрузки подпрограмм — нет
; параметры — только по значению / возвращаемому значению
; место объявления подпрограмм — в начале программы

program ImageExample1 {
    image img = load("cat.png");
    pixel p;

    p = img.getPixel(10, 20);
    if (p.color == color.RED) {
        p.color = color.BLUE;
    } else {
        p.color = color.GREEN;
    }

    img.setPixel(10, 20, p);
    save(img, "cat_modified.png");
}

program ImageExample2 {
    image toGray(image input) {
        image result = input;
        {
            int x = 0;
            int y = 0;
            
            while (y < result.height) {
                x = 0;
                while (x < result.width) {
                    pixel p = result.getPixel(x, y);
                    int avg = (p.color.red + p.color.green + p.color.blue) / 3;
                    p.color = color(avg, avg, avg);
                    result.setPixel(x, y, p);
                    x = x + 1;
                }
                y = y + 1;
            }
        }
        return result;
    }

    image img = load("dog.png");
    img = toGray(img);
    save(img, "dog_gray.png");
}

program ImageExample3 {
    image transform(image input, int mode) {
        image result;
        
        switch (mode) {
            case 1:
                result = flipHorizontal(input);
                break;
            case 2:
                result = rotate(input, 90);
                break;
            case 3:
                result = invert(input);
                break;
            default:
                result = input;
                break;
        }
        
        return result;
    }

    image img = load("landscape.png");
    int choice = read();
    img = transform(img, choice);
    write("Transformation complete!");
    save(img, "landscape_out.png");
}
