; Свойства:
; объявление переменных — явное
; преобразование типов — неявное
; оператор присваивания — одноцелевой (a = b)
; структуры, ограничивающие область видимости — подпрограммы
; маркер блочного оператора — явные { } или begin end
; условные операторы — if-then-else и switch-case
; перегрузки подпрограмм — нет
; параметры — только по значению / возвращаемому значению
; место объявления подпрограмм — в начале программы
; целевой код байт-код .NET, формат промежуточного кода ассемблер для .NET (CIL)
////////////////////////////////////////////////////////////////
// Определение пользовательской функции в начале программы
func create_gradient() {
    // Явное объявление переменных
    image img = new_image(256, 256); // Создаем изображение 256x256
    color c;
    int i = 0;
    int j = 0;

    // Цикл for для итерации по ширине изображения
    for i = 0 to 255 {
        // Вложенный цикл for для итерации по высоте
        for j = 0 to 255 {
            // Инициализация переменной типа color
            c = new_color(i, j, 128); // Создаем цвет
            // Присваивание пикселю нового цвета
            img[i, j] = c;
        }
    }

    // Сохранение изображения и вывод сообщения
    save(img, "gradient.png");
    write("Изображение 'gradient.png' успешно создано и сохранено.");
}

// Вызов основной функции
create_gradient();

////////////////////////////////////////////////////////////////
// Объявление глобальной переменной
string mode = "grayscale";

func transform_image() {
    // Загрузка существующего изображения
    image base_img = load("photo.png");
    image new_img = new_image(base_img.width, base_img.height);
    pixel p;
    color c;
    int i = 0;
    int j = 0;

    // Условный оператор if-then-else
    if (base_img == null) {
        write("Ошибка: не удалось загрузить изображение.");
    } else {
        // Оператор switch-case для выбора режима трансформации
        switch (mode) {
            case "grayscale": {
                write("Применяется фильтр оттенков серого...");
                for i = 0 to base_img.width - 1 {
                    for j = 0 to base_img.height - 1 {
                        p = base_img[i, j];
                        // Неявное преобразование int в color
                        int gray = (p.red + p.green + p.blue) / 3;
                        c = new_color(gray, gray, gray);
                        new_img[i, j] = c;
                    }
                }
                break;
            }
            case "invert": {
                write("Применяется инверсия цветов...");
                for i = 0 to base_img.width - 1 {
                    for j = 0 to base_img.height - 1 {
                        p = base_img[i, j];
                        c = new_color(255 - p.red, 255 - p.green, 255 - p.blue);
                        new_img[i, j] = c;
                    }
                }
                break;
            }
            default: {
                write("Неизвестный режим, копируем изображение.");
                new_img = base_img;
            }
        }
        save(new_img, "transformed.png");
        write("Трансформация завершена.");
    }
}

transform_image();


////////////////////////////////////////////////////////////////
// Глобальная переменная
int border_size = 10;

// Функция, которая принимает изображение и цвет, и возвращает новое изображение с рамкой
func add_border(image input_img, color border_color) -> image {
    // Локальные переменные, видимые только внутри этой функции
    int width = input_img.width;
    int height = input_img.height;
    image bordered_img = new_image(width, height);
    int i = 0;

    // Циклы while и until для демонстрации
    while (i < width) {
        int j = 0;
        until (j >= height) {
            // Условие для отрисовки рамки
            if (i < border_size || i >= width - border_size || j < border_size || j >= height - border_size) {
                bordered_img[i, j] = border_color;
            } else {
                bordered_img[i, j] = input_img[i, j];
            }
            j = j + 1;
        }
        i = i + 1;
    }
    // Возврат результата
    return bordered_img;
}

// Основная логика
func main() {
    image my_image = load("source.png");
    // Локальная переменная, не конфликтует с глобальной
    color frame_color = new_color(255, 0, 0); // Красный цвет

    if (my_image != null) {
        image result_image = add_border(my_image, frame_color);
        save(result_image, "bordered_image.png");
        write("Изображение с рамкой сохранено.");
    } else {
        write("Не удалось загрузить исходное изображение.");
    }
}

main();

